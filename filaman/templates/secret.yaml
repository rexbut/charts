{{- include "filaman.validate" . }}
{{- if include "filaman.createSecret" . }}
{{- $db := .Values.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "filaman.fullname" . }}
  labels:
    {{- include "filaman.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.filaman.existingSecret }}
  secret-key: {{ .Values.filaman.secretKey | b64enc | quote }}
  csrf-secret-key: {{ .Values.filaman.csrfSecretKey | b64enc | quote }}
  {{- with .Values.filaman.admin.password }}
  admin-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.filaman.oidcEncKey }}
  oidc-enc-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and (eq $db.type "postgresql") (not $db.postgresql.existingSecret) }}
  db-username: {{ $db.postgresql.username | b64enc | quote }}
  db-password: {{ $db.postgresql.password | b64enc | quote }}
  {{- end }}
  {{- if and (eq $db.type "external") (not $db.external.existingSecret) }}
  database-url: {{ $db.external.url | b64enc | quote }}
  {{- end }}
{{- end }}
