apiVersion: v1
kind: Service
metadata:
  name: {{ include "filaman.fullname" . }}-headless
  labels:
    {{- include "filaman.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "filaman.selectorLabels" . | nindent 4 }}
